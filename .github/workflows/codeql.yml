name: CodeQL

# A static-analysis signal on every change, and on a schedule so a newly
# published query reaches code that has not been touched since. The package is
# TypeScript only, so one language and no build step of its own.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, off-hours: the queries change more often than this code does.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: typescript
          # The extended suite as well: this package's whole job is to handle
          # credentials and other people's config files.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
