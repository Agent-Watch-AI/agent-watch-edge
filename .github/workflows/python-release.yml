name: Verify and prepare the Python release

on:
  pull_request:
    paths: ['python/**', '.github/workflows/python-release.yml']
  push:
    branches: [main]
    paths: ['python/**', '.github/workflows/python-release.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified distributions using the configured PyPI trusted publisher
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: python/agent-watch-otel

# Actions are pinned to commit SHAs, not to tags: a tag is mutable, and these run
# in the job that builds the distributions that get published. The trailing
# comment is the version each SHA was, so a bump stays reviewable.
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      # Both ends of the supported range are reported: a failure on the floor and
      # a failure on the release runtime need different answers.
      fail-fast: false
      matrix:
        # `requires-python` promises 3.9, so 3.9 is tested. Without this the floor
        # is a number nothing verifies.
        python: ['3.9', '3.13']
        os: [ubuntu-latest, macos-latest]
        exclude:
          # `macos-latest` is arm64 and python-versions ships no arm64 build of
          # 3.9, so setup-python fails with "Version 3.9 was not found" — which
          # would make every PR touching `python/**` red and the release path
          # unreachable. The floor is verified on Linux.
          - python: '3.9'
            os: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # The package's own promise is stdlib plus opentelemetry-sdk, so that is
      # the whole test environment. A test dependency here would be a claim the
      # published package cannot make.
      - run: pip install opentelemetry-sdk
      # The parity check is named separately from the suite it is part of: it is
      # the one that fails when this port and core's fingerprint drift apart, and
      # a reviewer reading a red run should not have to find it among the rest.
      - run: python -m unittest tests.test_vectors --verbose
      - run: python -m unittest --verbose

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: pip install build==1.3.0
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-release
          path: python/agent-watch-otel/dist/
          if-no-files-found: error

  publish:
    # Publishing is a deliberate act, never a consequence of merging. The founder
    # dispatches this; nothing on the push path reaches it.
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      contents: read
      # What trusted publishing runs on: PyPI exchanges this short-lived OIDC
      # token for an upload token, so no long-lived API token exists to leak.
      # It is also what signs the attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-release
          path: dist
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist
          # PEP 740 attestations, generated from the same OIDC identity that
          # uploads and retained by PyPI: the published artefact can be traced
          # back to this workflow, on this repository, at this commit.
          attestations: true
          print-hash: true
