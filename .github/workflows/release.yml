name: Verify and prepare release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package using the configured npm trusted publisher
        type: boolean
        default: false

permissions:
  contents: read

# Actions are pinned to commit SHAs, not to tags: a tag is mutable, and these
# run in the job that builds the tarball that gets published. The trailing
# comment is the version each SHA was, so a bump stays reviewable.
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      # Both runtimes are reported: a failure on the floor and a failure on the
      # release runtime need different answers.
      fail-fast: false
      matrix:
        # `engines` and README.md promise Node 20, so Node 20 is tested. The
        # code uses recent APIs (AbortSignal.timeout, fs.realpathSync.native,
        # Array.prototype.at); without this the floor is a number nothing
        # verifies.
        node: ['20', '24']
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No dependency lifecycle scripts: pack and publish already run with
      # --ignore-scripts, and install is the remaining place a transitive
      # dependency could execute code in the job that builds the tarball.
      - run: npm ci --ignore-scripts
      # Coverage, not just a green suite: the per-directory floors in
      # vitest.config.ts are what makes "the privacy path is tested" a number
      # a reviewer can read rather than a claim.
      - run: npm run coverage
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - if: matrix.node == '24'
        run: node scripts/benchmark.mjs > benchmark.json
      - if: matrix.node == '24'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-${{ matrix.os }}
          path: benchmark.json
          if-no-files-found: error
      # A vulnerability signal between releases: the SBOM says what is in the
      # tree and nothing was checking it against advisories. Production
      # dependencies only, and only high and above, so this fails on something
      # that ships rather than on a devDependency's transitive advisory.
      - if: matrix.node == '24' && matrix.os == 'ubuntu-latest'
        run: npm audit --omit=dev --audit-level=high
      # The published tarball is built once, on the release runtime. Node 20 is
      # here to prove the floor, not to produce artifacts.
      - if: matrix.node == '24' && matrix.os == 'ubuntu-latest'
        run: npm run release:artifacts
      - if: matrix.node == '24' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release
          path: artifacts/
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release
          path: artifacts
      - name: Verify and publish the tested tarball
        working-directory: artifacts
        # The checksums travel in the same artifact as the tarball, so this
        # catches a corrupted transfer, not a tampered one. Publisher identity
        # comes from npm trusted publishing and --provenance, not from here.
        run: |
          sha256sum --check SHA256SUMS
          npm publish ./*.tgz --access public --provenance --ignore-scripts
