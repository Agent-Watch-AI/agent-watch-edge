name: Verify and prepare release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package using the configured npm trusted publisher
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      # Both runtimes are reported: a failure on the floor and a failure on the
      # release runtime need different answers.
      fail-fast: false
      matrix:
        # `engines` and README.md promise Node 20, so Node 20 is tested. The
        # code uses recent APIs (AbortSignal.timeout, fs.realpathSync.native,
        # Array.prototype.at); without this the floor is a number nothing
        # verifies.
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # No dependency lifecycle scripts: pack and publish already run with
      # --ignore-scripts, and install is the remaining place a transitive
      # dependency could execute code in the job that builds the tarball.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # The published tarball is built once, on the release runtime. Node 20 is
      # here to prove the floor, not to produce artifacts.
      - if: matrix.node == '24'
        run: npm run release:artifacts
      - if: matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: artifacts/
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: artifacts
      - name: Verify and publish the tested tarball
        working-directory: artifacts
        # The checksums travel in the same artifact as the tarball, so this
        # catches a corrupted transfer, not a tampered one. Publisher identity
        # comes from npm trusted publishing and --provenance, not from here.
        run: |
          sha256sum --check SHA256SUMS
          npm publish ./*.tgz --access public --provenance --ignore-scripts
